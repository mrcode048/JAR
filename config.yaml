# Jarvis AI Assistant - Konfigürasyon

# Ses Ayarları
speech:
  language: tr-TR
  voice_rate: 150
  voice_volume: 0.9
  listen_timeout: 5

# AI Ayarları
ai:
  model: "local"  # local, openai, google
  confidence_threshold: 0.7
  learning_enabled: true

# Sistem Ayarları
system:
  auto_update: true
  log_level: INFO
  debug_mode: false

# Görev Otomasyonu
tasks:
  enabled: true
  scheduled_tasks:
    - name: "Günlük Haber"
      time: "09:00"
      enabled: false
    
    - name: "Sistem Kontrolü"
      time: "18:00"
      enabled: false

# Donanım Kontrolü
hardware:
  enable_volume_control: true
  enable_brightness_control: true
  enable_app_launch: true
